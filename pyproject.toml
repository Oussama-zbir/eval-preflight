[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-preflight"
dynamic = ["version"]
description = "A pre-flight check for LLM eval results: catches partial runs, failed judges, mislabelled scores and inconsistent aggregation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oussama Zbir" }]
keywords = ["llm", "evaluation", "evals", "ci", "data-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "rich>=13",
]

[project.urls]
Repository = "https://github.com/Oussama-zbir/eval-preflight"
Documentation = "https://github.com/Oussama-zbir/eval-preflight/tree/main/docs"
Issues = "https://github.com/Oussama-zbir/eval-preflight/issues"
Changelog = "https://github.com/Oussama-zbir/eval-preflight/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Only for the in-memory EvaluationReport path; JSON reports never import it.
pydantic-evals = ["pydantic-evals>=2.61,<3"]

[project.scripts]
eval-preflight = "eval_preflight.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    # Same version as tests/fixtures/pydantic_evals/VERSION: the in-memory tests compare
    # live reports with the generated fixtures.
    "pydantic-evals==2.61.0",
    "pytest>=8.2",
    # scripts/run_action_example.py reads examples/github-action.yml.
    "pyyaml>=6",
    "pytest-cov>=5",
    "ruff>=0.6",
]

# One version, in the package; `eval-preflight --version` and the wheel agree by construction.
[tool.hatch.version]
path = "src/eval_preflight/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [".github", "CLAUDE.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/eval_preflight"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# SPEC.md is the contract; ruff must not reformat its code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["eval_preflight"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if TYPE_CHECKING:", 'if __name__ == "__main__":']

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
